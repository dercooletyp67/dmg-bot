<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emergency Alerts</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --primary: #3b82f6;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      width: 100%;
      padding: 20px;
      text-align: center;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-sizing: border-box;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; text-transform: uppercase; }
    p { margin: 5px 0 0 0; color: #94a3b8; font-size: 0.9rem; }
    
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      gap: 30px;
    }

    .alert-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 250px;
      height: 250px;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4), inset 0 -5px 15px rgba(0,0,0,0.2);
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .alert-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4), inset 0 5px 20px rgba(0,0,0,0.3);
      background: var(--danger-hover);
    }

    .alert-btn svg {
      width: 60px;
      height: 60px;
    }

    #login-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }

    input {
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      font-size: 1.1rem;
      text-align: center;
    }

    .login-btn {
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Emergency Alerts</h1>
    <p>Command Center</p>
  </header>

  <div class="container" id="login-view">
    <p>Enter Admin Password to continue</p>
    <div id="login-container">
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" onclick="login()">Unlock</button>
    </div>
  </div>

  <div class="container" id="app-view" style="display: none;">
    <button class="alert-btn" id="btn-territory" onclick="triggerAlert('territory')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      Territory Attack
    </button>
    <p id="status-text" style="height: 20px; color: #10b981; font-weight: bold; transition: opacity 0.3s; opacity: 0;"></p>
  </div>

  <script>
    let token = localStorage.getItem('dmg_token');

    if (token) {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'flex';
    }

    async function login() {
      const pwd = document.getElementById('password').value;
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      if (res.ok) {
        localStorage.setItem('dmg_token', pwd);
        token = pwd;
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'flex';
      } else {
        alert('Incorrect password');
      }
    }

    async function triggerAlert(type) {
      if (!token) return;
      const btn = document.getElementById('btn-' + type);
      const status = document.getElementById('status-text');
      
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';
      
      try {
        const res = await fetch(`/api/alerts/${type}`, {
          method: 'POST',
          headers: { 'Authorization': token }
        });
        
        if (res.ok) {
          status.textContent = 'ALERT SENT SUCCESSFULLY!';
          status.style.color = '#10b981';
          status.style.opacity = '1';
          if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (res.status === 401) {
          localStorage.removeItem('dmg_token');
          location.reload();
        } else {
          status.textContent = 'FAILED TO SEND ALERT.';
          status.style.color = '#ef4444';
          status.style.opacity = '1';
        }
      } catch (err) {
        status.textContent = 'NETWORK ERROR.';
        status.style.color = '#ef4444';
        status.style.opacity = '1';
      }
      
      setTimeout(() => {
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'all';
        status.style.opacity = '0';
      }, 3000);
    }
  </script>
</body>
</html>
